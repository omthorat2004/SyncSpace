version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: syncspace-postgres
    environment:
      POSTGRES_USER: syncspace_user
      POSTGRES_PASSWORD: syncspace_password
      POSTGRES_DB: syncspace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncspace_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: syncspace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: syncspace-server
    environment:
      DATABASE_URL: postgresql://syncspace_user:syncspace_password@postgres:5432/syncspace_db
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src
    command: uvicorn src.server.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: syncspace-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - server
    volumes:
      - ./client/src:/app/src

volumes:
  postgres_data:
  redis_data:
